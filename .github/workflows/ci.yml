name: Verify
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts/bootstrap.py
      - run: ruff format --check src tests scripts/bootstrap.py
      - run: pytest -q
      - run: python -m drone_assistant demo
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t drone-parts-assistant:ci .
      - run: docker run --rm drone-parts-assistant:ci python -m drone_assistant demo
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --check web/app.js
      - run: npm run test:web
  openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --prefix "$RUNNER_TEMP/openclaw-runtime" --ignore-scripts --no-audit --no-fund openclaw@2026.10.3
      - run: node scripts/check-openclaw.mjs "$RUNNER_TEMP/openclaw-runtime/node_modules/openclaw"
