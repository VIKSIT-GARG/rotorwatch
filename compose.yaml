services:
  assistant:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/assistant.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - assistant-data:/app/data
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assistant-data:
